spring.application.name=url-shortener

# MySQL - set these as environment variables when deploying (Render/Railway)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urlshortener}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis - Upstash/Railway give you a host + port + password
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Public base URL used when building short links, e.g. https://short-yourname.onrender.com
app.base-url=${APP_BASE_URL:http://localhost:8080}

server.port=${PORT:8080}
